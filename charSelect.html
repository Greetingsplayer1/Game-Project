<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CharSelect</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="charMenu">
        <h1 id="charLabel">Select your character:</h1>

        <button id="lArr">&#x2B9C;</button>
        <button id="rArr">&#x2B9E;</button>

        <img id="charImg" src="media/fighter.svg" alt="Human fighter. Boring...">
        <div id="charName">
            <h3>Fighter</h3>
        </div>
        
        <p id="charDesc">Just a basic fighter. No specific strengths nor weaknesses.</p>

        <button id="play">Play!</button>
    </body>
</html>
